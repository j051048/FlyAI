name: CI

on:
  push:
    branches: [master, "release/**", "feature/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required checks:
# 1. Tier 1 (CPU): Config & doc reference integrity, CPU pytest suite, Go sidecar build + tests.
# 2. Tier 2 (GPU): Self-hosted CUDA runners for V4 engine regression and losslessness verification
#    (triggered on workflow_dispatch or PRs labeled 'run-gpu'; see docs/PROOF.md & docs/RESOURCE_CONTRACT.md).
jobs:
  python:
    name: python tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps (CPU torch + declared runtime deps)
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # The CPU suite exercises real owned-process deployment/recovery.
          python -m pip install -e ".[k3,deploy]"
          python -m pip install pytest transformers safetensors
      - name: check config and doc reference integrity
        run: python tools/check_references.py
      - name: collect-only must be side-effect free (no network/subprocess/import work)
        run: python -m pytest tests/ --collect-only -q
      - name: pytest (CPU suite)
        run: python -m pytest tests/ -m "not gpu" -q

  go-sidecar:
    name: go sidecar build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
      - name: build + test (a build failure fails CI — never a silent skip)
        working-directory: sidecar
        run: |
          go build ./...
          go test ./...

  python-gpu:
    name: python tests (GPU, self-hosted)
    runs-on: [self-hosted, linux, x64, gpu, sm120]
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gpu') }}
    steps:
      - uses: actions/checkout@v4
      - name: require idle dedicated CUDA runner
        run: |
          nvidia-smi
          python -V
          if [ -n "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader)" ]; then
            echo "Runner has active GPU processes; refusing to disturb existing workloads."
            exit 1
          fi
      - name: install deps (GPU)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[k3,deploy]"
          python -m pip install pytest pytest-timeout transformers safetensors
      - name: verify real CUDA and record runtime
        run: |
          python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.get_device_capability(0) == (12, 0); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))"
      - name: pytest (GPU suite)
        run: python -m pytest tests/ -v -m "gpu" --timeout=3600 --junitxml=gpu-results.xml
      - name: retain GPU regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-regression-${{ github.sha }}
          path: gpu-results.xml
          if-no-files-found: warn
